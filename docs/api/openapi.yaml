        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Credencial/sesión inválida o vencida: INVALID_CREDENTIALS,\
            \ SESSION_INVALID o ACCESS_TOKEN_EXPIRED; login también puede informar\
            \ EMAIL_NOT_VERIFIED o ACCOUNT_SUSPENDED"
        "403":
          content:
