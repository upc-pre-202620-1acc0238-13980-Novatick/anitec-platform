info:
  description: "ANITEC: API v1 para GANADERO y VETERINARIO. Cinco bounded contexts\
    \ y bandeja in-app. Simulación académica. No se realizará ningún cobro. No hay\
    \ Stripe, Google Play Billing ni FCM real. Fechas Instant en UTC; fechas clínicas\
    \ y nacimiento como yyyy-MM-dd. El sobre omite sus campos nulos; los DTO anidados\
    \ pueden contener null según su esquema. Un campo opcional de entrada puede admitir\
    \ null. Los permisos dependen además de propiedad, vinculación activa y autorí\
    a. En prod+staging todas las operaciones requieren además la barrera privada de\
    \ staging; nunca distribuir su clave en una APK."
  title: ANITEC API
  version: 1.0.0-mvp-candidate
openapi: 3.0.1
paths:
  /api/v1/account/me:
    get:
      description: "Autorización: GANADERO o VETERINARIO, con cuenta activa/verificada\
        \ y sesión vigente. "
      operationId: get_api_v1_account_me
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseAccountProfile"
          description: Operación correcta
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Credencial/sesión inválida o vencida: INVALID_CREDENTIALS,\
            \ SESSION_INVALID o ACCESS_TOKEN_EXPIRED; login también puede informar\
            \ EMAIL_NOT_VERIFIED o ACCOUNT_SUSPENDED"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: FORBIDDEN por permisos o STAGING_ACCESS_DENIED por barrera
            de staging
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "INTERNAL_ERROR: fallo inesperado sanitizado"
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "AUTHENTICATION_UNAVAILABLE: no se pudo comprobar la sesió\
            n; las rutas de simulación también devuelven PAYMENTS_UNAVAILABLE si no\
            \ están autorizadas"
      security:
      - bearerAuth: []
      summary: Perfil de la cuenta autenticada (incluye badge de perfil)
      tags:
      - Cuenta
      x-module: identity
      x-roles:
      - GANADERO
      - VETERINARIO
    put:
      description: "Autorización: GANADERO o VETERINARIO, con cuenta activa/verificada\
        \ y sesión vigente. "
      operationId: put_api_v1_account_me
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseAccountProfile"
          description: Operación correcta
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "VALIDATION_ERROR: cuerpo/parámetros inválidos; ver details.\
            \ Recuperación: RECOVERY_CODE_INVALID si el código no es utilizable."
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Credencial/sesión inválida o vencida: INVALID_CREDENTIALS,\
            \ SESSION_INVALID o ACCESS_TOKEN_EXPIRED; login también puede informar\
            \ EMAIL_NOT_VERIFIED o ACCOUNT_SUSPENDED"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: FORBIDDEN por permisos o STAGING_ACCESS_DENIED por barrera
            de staging
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Conflicto de estado, integridad o concurrencia: INVALID_STATE_TRANSITION,\
            \ ALREADY_EXISTS, INVALID_REFERENCE, CONCURRENT_UPDATE; en animales ANIMAL_VERSION_CONFLICT/DUPLICATE_ANIMAL_CODE;\
            \ en clínica ATTENTION_REQUIRED/ATTENTION_ALREADY_EXISTS cuando corresponda."
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "INTERNAL_ERROR: fallo inesperado sanitizado"
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "AUTHENTICATION_UNAVAILABLE: no se pudo comprobar la sesió\
            n; las rutas de simulación también devuelven PAYMENTS_UNAVAILABLE si no\
            \ están autorizadas"
      security:
      - bearerAuth: []
      summary: Actualizar datos personales del perfil
      tags:
      - Cuenta
      x-module: identity
      x-roles:
      - GANADERO
      - VETERINARIO
  /api/v1/animals:
    get:
      description: "Autorización: GANADERO o VETERINARIO, con cuenta activa/verificada\
        \ y sesión vigente. La lectura se limita al propietario o veterinario con\
        \ vinculación activa; las escrituras clínicas requieren veterinario autorizado\
        \ y autoría según la operación. "
      operationId: get_api_v1_animals
      parameters:
      - in: query
        name: farmId
        required: false
        schema:
          format: uuid
          type: string
      - in: query
        name: search
        required: false
        schema:
          type: string
      - in: query
        name: species
        required: false
        schema:
          format: uuid
          type: string
      - in: query
        name: status
        required: false
        schema:
          enum:
          - ACTIVO
          - FALLECIDO
          - INACTIVO
          - VENDIDO
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseInventoryResponse"
          description: Operación correcta
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "VALIDATION_ERROR: cuerpo/parámetros inválidos; ver details.\
            \ Recuperación: RECOVERY_CODE_INVALID si el código no es utilizable."
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Credencial/sesión inválida o vencida: INVALID_CREDENTIALS,\
            \ SESSION_INVALID o ACCESS_TOKEN_EXPIRED; login también puede informar\
            \ EMAIL_NOT_VERIFIED o ACCOUNT_SUSPENDED"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: FORBIDDEN por permisos o STAGING_ACCESS_DENIED por barrera
            de staging
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "INTERNAL_ERROR: fallo inesperado sanitizado"
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "AUTHENTICATION_UNAVAILABLE: no se pudo comprobar la sesió\
            n; las rutas de simulación también devuelven PAYMENTS_UNAVAILABLE si no\
            \ están autorizadas"
      security:
      - bearerAuth: []
      summary: "Inventario con filtros (search, species, status, farmId)"
      tags:
      - Animales
      x-module: livestock
      x-roles:
      - GANADERO
      - VETERINARIO
    post:
      description: "Autorización: GANADERO, con cuenta activa/verificada y sesión\
        \ vigente. La lectura se limita al propietario o veterinario con vinculació\
        n activa; las escrituras clínicas requieren veterinario autorizado y autorí\
        a según la operación. "
      operationId: post_api_v1_animals
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnimalDataRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseAnimalListItem"
          description: Recurso creado
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "VALIDATION_ERROR: cuerpo/parámetros inválidos; ver details.\
            \ Recuperación: RECOVERY_CODE_INVALID si el código no es utilizable."
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Credencial/sesión inválida o vencida: INVALID_CREDENTIALS,\
            \ SESSION_INVALID o ACCESS_TOKEN_EXPIRED; login también puede informar\
            \ EMAIL_NOT_VERIFIED o ACCOUNT_SUSPENDED"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: FORBIDDEN por permisos o STAGING_ACCESS_DENIED por barrera
            de staging
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Conflicto de estado, integridad o concurrencia: INVALID_STATE_TRANSITION,\
            \ ALREADY_EXISTS, INVALID_REFERENCE, CONCURRENT_UPDATE; en animales ANIMAL_VERSION_CONFLICT/DUPLICATE_ANIMAL_CODE;\
            \ en clínica ATTENTION_REQUIRED/ATTENTION_ALREADY_EXISTS cuando corresponda."
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Regla de negocio no satisfecha: elegibilidad, cupo, perfil,\
            \ plan o transición. Consultar errorCode, no inferir datos privados."
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "INTERNAL_ERROR: fallo inesperado sanitizado"
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "AUTHENTICATION_UNAVAILABLE: no se pudo comprobar la sesió\
            n; las rutas de simulación también devuelven PAYMENTS_UNAVAILABLE si no\
            \ están autorizadas"
      security:
      - bearerAuth: []
      summary: "Registrar un animal (Ganadero, respeta la capacidad de su plan)"
      tags:
      - Animales
      x-module: livestock
      x-roles:
      - GANADERO
  /api/v1/animals/capacity:
    get:
      description: "Autorización: GANADERO, con cuenta activa/verificada y sesión\
        \ vigente. La lectura se limita al propietario o veterinario con vinculació\
        n activa; las escrituras clínicas requieren veterinario autorizado y autorí\
        a según la operación. "
      operationId: get_api_v1_animals_capacity
