spring:
  application:
    name: anitec-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/anitec}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    placeholders:
      # Required only to parse immutable V9. The inert row is removed by V11
      # before the application starts; no administrative credentials are configured.
      admin_email: retired-admin@bootstrap.invalid
      admin_password_hash: DISABLED-HISTORICAL-BOOTSTRAP
      demo_seed: ${DEMO_SEED:true}

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

jwt:
  # Development default only (>= 256 bits). Production MUST provide JWT_SECRET.
  secret: ${JWT_SECRET:anitec-dev-only-secret-key-change-me-32bytes-min!!}
  expiration-ms: 86400000            # 24 h access token
  refresh-expiration-ms: 604800000   # 7 d refresh token

resend:
  api-key: ${RESEND_API_KEY:}
  from: ${RESEND_FROM:ANITEC <onboarding@resend.dev>}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

# Simulation additionally requires the dev or test profile; prod always refuses it.
payments:
  simulation-enabled: ${PAYMENTS_SIMULATION_ENABLED:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs
