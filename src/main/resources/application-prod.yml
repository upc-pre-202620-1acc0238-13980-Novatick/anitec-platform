# Production profile (Render): all secrets/values come from environment variables.
jwt:
  secret: ${JWT_SECRET:}

spring:
  jpa:
    show-sql: false
  flyway:
    placeholders:
      demo_seed: ${DEMO_SEED:false}   # demo users are not seeded in production

payments:
  simulation-enabled: false

logging:
  level:
    com.anitec.backend: INFO

# Swagger stays publicly reachable (decision #20 of the spec).
springdoc:
  swagger-ui:
    path: /swagger-ui.html
